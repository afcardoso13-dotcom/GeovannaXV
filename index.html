<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Geovanna XV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<main id="app">

    <!-- O vídeo inicia diretamente na primeira cena.
         O brilho sobre a joia funciona como o ponto de entrada. -->

<!-- PLAYER -->

<div id="player">

    <!-- Vídeo -->
    <video
    id="video"
    playsinline
    preload="auto"
    poster="assets/imagens/inicio.jpg">

        <source src="assets/videos/projetogeoxv_3.mp4" type="video/mp4">

        Seu navegador não suporta vídeos.

    </video>

        <!-- Efeitos -->
        <div id="effects">

            <div class="glow" id="glowWhatsapp"></div>

            <div class="glow" id="glowGrandeDia"></div>

            <div class="glow" id="glowLocalizacao"></div>

            <div class="glow" id="glowDressCode"></div>

            <div class="glow" id="glowPresentes"></div>

        </div>

        <!-- Ponto de entrada sobre a joia -->
        <div id="startJewel" role="button" tabindex="0" aria-label="Abrir convite"></div>

        <!-- Hotspots -->
        <div id="hotspots">

            <div class="hotspot" id="btnWhatsapp"></div>

            <div class="hotspot" id="btnGrandeDia"></div>

            <div class="hotspot" id="btnLocalizacao"></div>

            <div class="hotspot" id="btnDressCode"></div>

            <div class="hotspot" id="btnPresentes"></div>

        </div>

    </div>

    <!-- Overlay -->
    <div id="overlay"></div>

    <!-- Modal Universal -->
    <div id="modal">

        <div class="modal-box">

            <!-- Fechar -->
            <button id="closeModal">&times;</button>

            <!-- Imagem Superior -->
            <img
                id="modalImage"
                src=""
                alt=""
            >

            <!-- Título -->
            <h2 id="modalTitle"></h2>

            <!-- Texto -->
           <div id="modalText"></div>

            <!-- Botão -->
            <a
                id="modalButton"
                href="#"
                target="_blank"
            >

                <img
                    id="modalButtonIcon"
                    src=""
                    alt=""
                >

                <span id="modalButtonText"></span>

            </a>

        </div>

    </div>

</main>

<script src="assets/js/script.js"></script>

</body>

</html>
